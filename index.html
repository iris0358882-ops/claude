<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#121211" />
  <title>Grey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景：粉色紙張（或自己的照片） -->
  <div class="backdrop" aria-hidden="true">
    <div id="photo" class="photo"></div>
    <canvas id="rain"></canvas>
    <div class="grain"></div>
  </div>

  <div class="app">
    <header class="log">
      <div class="portrait">
        <div class="portrait-img" id="ai-avatar-top"></div>
        <div class="portrait-tag" id="ai-tag">GREY</div>
      </div>

      <div class="log-main">
        <div class="log-top">
          <span class="kicker">Field Notes</span>
          <span class="status" id="status">醒著</span>
          <button class="menu-btn" id="open-settings" aria-label="設定">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
        </div>
        <div class="title-row">
          <h1 id="title">Grey</h1>
          <div class="weather" id="weather" hidden><b id="w-temp"></b><span id="w-desc"></span></div>
        </div>
        <div class="sub"><span id="subtitle">觀測記錄</span><i>after dark · on record</i></div>
        <nav class="days" id="days" aria-label="日期"></nav>
      </div>

      <button class="tide" id="tide" aria-label="用量與帳本">
        <span class="tide-label">Load</span>
        <span class="tide-fill" id="tide-fill"></span>
        <span class="tide-tick" style="top:38%"></span>
        <span class="tide-tick" style="top:66%"></span>
        <b class="tide-num" id="tide-num">0</b>
      </button>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="給 Grey 發消息…" enterkeyhint="send"></textarea>
      <button type="submit" class="send" id="send" disabled>Send</button>
    </form>

    <nav class="toolbar" aria-label="附件">
      <button type="button" id="pick-photo" aria-label="傳照片">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18"/></svg>
      </button>
      <button type="button" id="open-stickers" aria-label="貼圖">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20 12.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6.5"/><path d="M20 12.5 12.5 20c0-4.1 3.4-7.5 7.5-7.5Z"/><path d="M9 10h.01M15 10h.01M9 14.5c1.5 1.3 4 1.3 5.5 0" stroke-linecap="round"/></svg>
      </button>
      <input id="photo-input" type="file" accept="image/*" hidden />
    </nav>
  </div>

  <!-- 帳本：本輪用量、花費、上下文、注入內容 -->
  <dialog id="ledger" class="ticket-sheet">
    <div class="ticket">
      <div class="ticket-rule"></div>
      <div class="ticket-head">
        <div>
          <div class="ticket-title">Ledger</div>
          <div class="ticket-kicker">A Receipt</div>
        </div>
        <div class="ticket-meta">
          <span>本輪</span>
          <b id="l-time">--:--</b>
        </div>
        <button class="ticket-close" id="ledger-close" aria-label="關閉">×</button>
      </div>
      <div id="ledger-body" class="ticket-body"></div>
    </div>
  </dialog>

  <!-- 貼圖 -->
  <dialog id="stickers" class="ticket-sheet">
    <div class="ticket">
      <div class="ticket-rule"></div>
      <div class="ticket-head">
        <div>
          <div class="ticket-title">Stickers</div>
          <div class="ticket-kicker">Collected</div>
        </div>
        <button type="button" class="link" id="stickers-manage">管理</button>
        <button class="ticket-close" id="stickers-close" aria-label="關閉">×</button>
      </div>
      <p class="ledger-note">點一下傳給對方。對方也能從這裡挑貼圖回你，所以名字取得好認一點，例如「偷看」「生氣」。</p>
      <div class="sticker-grid" id="sticker-grid"></div>
      <input id="sticker-input" type="file" accept="image/*" multiple hidden />
    </div>
  </dialog>

  <!-- 設定 -->
  <dialog id="settings" class="ticket-sheet">
    <form method="dialog" class="ticket settings">
      <div class="ticket-rule"></div>
      <div class="ticket-head">
        <div>
          <div class="ticket-title">Settings</div>
          <div class="ticket-kicker">Preferences</div>
        </div>
        <button class="ticket-close" value="close" aria-label="關閉">×</button>
      </div>

      <fieldset>
        <legend>對方</legend>
        <label>名字 <input id="s-ai-name" type="text" maxlength="24" /></label>
        <div class="row">
          <span>頭像</span>
          <label class="file-btn">選擇圖片<input id="s-ai-avatar" type="file" accept="image/*" hidden /></label>
          <button type="button" class="link" id="s-ai-avatar-reset">還原</button>
        </div>
        <label>人設（system prompt）<textarea id="s-system" rows="5"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>頁首</legend>
        <label>大標題 <input id="s-title" type="text" maxlength="24" /></label>
        <label>副標題 <input id="s-subtitle" type="text" maxlength="24" /></label>
        <label>我的名字 <input id="s-user-name" type="text" maxlength="24" /></label>
        <label>天氣城市（留空就不顯示；找不到的話用英文）<input id="s-city" type="text" maxlength="40" placeholder="例如：台北、東京、London" /></label>
      </fieldset>

      <fieldset>
        <legend>Claude API <span class="hint">不填 key 就用示範回覆</span></legend>
        <label>API Key <input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off" /></label>
        <label>模型 <input id="s-model" type="text" /></label>
        <label>思考強度
          <select id="s-effort">
            <option value="low">low（聊天最快）</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <label class="check"><input id="s-inject-time" type="checkbox" /> 每輪告訴對方現在幾點和天氣</label>
        <p class="hint">Key 只存在這個瀏覽器的 localStorage，直接從瀏覽器呼叫 API，請只在自己的裝置上使用。</p>
      </fieldset>

      <fieldset>
        <legend>背景</legend>
        <div class="row">
          <span>背景照片</span>
          <label class="file-btn">選擇圖片<input id="s-bg" type="file" accept="image/*" hidden /></label>
          <button type="button" class="link" id="s-bg-reset">還原</button>
        </div>
        <label>照片模糊 <input id="s-blur" type="range" min="0" max="30" step="1" /></label>
        <label class="check"><input id="s-gray" type="checkbox" /> 照片黑白</label>
        <label class="check"><input id="s-rain" type="checkbox" /> 玻璃上的雨</label>
      </fieldset>

      <div class="actions">
        <button type="button" class="danger" id="s-clear">清空對話</button>
        <button value="close" class="primary">完成</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
