<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#9a9a9a" />
  <title>Grey</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景：模糊的街景 + 玻璃上的雨滴 -->
  <div class="backdrop" aria-hidden="true">
    <canvas id="scene"></canvas>
    <div id="photo" class="photo"></div>
    <canvas id="rain"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="app">
    <header class="topbar glass">
      <div class="avatar ai small" aria-hidden="true"></div>
      <div class="who">
        <div class="name" id="ai-name-top">Grey</div>
        <div class="status" id="status">在線</div>
      </div>
      <button class="icon-btn" id="open-settings" aria-label="設定">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="composer" class="composer glass" autocomplete="off">
      <textarea id="input" rows="1" placeholder="說點什麼…" enterkeyhint="send"></textarea>
      <button type="submit" class="send" id="send" aria-label="送出" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
  </div>

  <!-- 設定 -->
  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-inner">
      <h2>設定</h2>

      <fieldset>
        <legend>對方</legend>
        <label>名字 <input id="s-ai-name" type="text" maxlength="24" /></label>
        <label>人設（system prompt）<textarea id="s-system" rows="5"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>Claude API <span class="hint">不填 key 就用示範回覆</span></legend>
        <label>API Key <input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off" /></label>
        <label>模型 <input id="s-model" type="text" /></label>
        <label>思考強度
          <select id="s-effort">
            <option value="low">low（聊天最快）</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <p class="hint">Key 只存在這個瀏覽器的 localStorage，直接從瀏覽器呼叫 API，請只在自己的裝置上使用。</p>
      </fieldset>

      <fieldset>
        <legend>外觀</legend>
        <div class="row">
          <span>我的頭像</span>
          <label class="file-btn">選擇圖片<input id="s-avatar" type="file" accept="image/*" hidden /></label>
          <button type="button" class="link" id="s-avatar-reset">還原</button>
        </div>
        <div class="row">
          <span>背景照片</span>
          <label class="file-btn">選擇圖片<input id="s-bg" type="file" accept="image/*" hidden /></label>
          <button type="button" class="link" id="s-bg-reset">還原</button>
        </div>
        <label>背景模糊 <input id="s-blur" type="range" min="0" max="30" step="1" /></label>
        <label class="check"><input id="s-gray" type="checkbox" /> 黑白</label>
        <label class="check"><input id="s-rain" type="checkbox" /> 玻璃上的雨</label>
      </fieldset>

      <div class="actions">
        <button type="button" class="danger" id="s-clear">清空對話</button>
        <button value="close" class="primary">完成</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
