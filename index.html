<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#e3a1ad" />
  <title>Claude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 背景：粉色紙張（或自己的照片） -->
  <div class="backdrop" aria-hidden="true">
    <div id="photo" class="photo"></div>
    <div class="grain"></div>
  </div>

  <!-- 郵戳上的環狀文字共用這條路徑 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><path id="stamp-arc" d="M50,50 m-36,0 a36,36 0 1,1 72,0 a36,36 0 1,1 -72,0" /></defs>
  </svg>

  <div class="app">
    <button class="menu-btn" id="open-settings" aria-label="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>

    <!-- 今日卡片：日期、天氣、待辦、提醒 -->
    <section id="today" class="today">
      <button type="button" class="today-bar" id="today-toggle" aria-expanded="true">
        <span class="today-date"><b id="t-date"></b><span class="caps" id="t-week"></span></span>
        <span class="today-weather" id="t-weather">—</span>
        <span class="today-count" id="t-count"></span>
      </button>
      <div class="today-body" id="today-body">
        <div class="today-col">
          <h3 class="legend">To do</h3>
          <ul id="t-todos" class="todos"></ul>
          <form id="t-add" class="todo-add" autocomplete="off">
            <input id="t-add-input" type="text" placeholder="＋ 加一件事" maxlength="80" enterkeyhint="done" />
          </form>
        </div>
        <div class="today-col" id="t-rem-col">
          <h3 class="legend">Reminders</h3>
          <ul id="t-reminders" class="reminders"></ul>
        </div>
      </div>
    </section>

    <main id="chat" class="chat" aria-live="polite"></main>

    <div class="quick" id="quick" aria-label="快捷">
      <button type="button" data-say="今天有什麼要做的？">今天要做什麼</button>
      <button type="button" data-say="今天跟明天天氣怎樣？要帶傘嗎？">天氣</button>
      <button type="button" data-fill="幫我記一下：">記一件事</button>
      <button type="button" data-fill="提醒我 ">設提醒</button>
      <button type="button" data-say="晚餐吃什麼好？給我三個選項。">晚餐吃什麼</button>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="給 Claude 發消息…" enterkeyhint="send"></textarea>
      <button type="submit" class="send" id="send" disabled>Send</button>
    </form>
  </div>

  <!-- 設定 -->
  <dialog id="settings" class="ticket-sheet">
    <form method="dialog" class="ticket settings">
      <div class="ticket-rule"></div>
      <div class="ticket-head">
        <div>
          <div class="ticket-title">Settings</div>
          <div class="ticket-kicker">Preferences</div>
        </div>
        <button class="ticket-close" value="close" aria-label="關閉">×</button>
      </div>

      <fieldset>
        <h3 class="legend">對方</h3>
        <label>名字 <input id="s-ai-name" type="text" maxlength="24" /></label>
        <label>人設（system prompt）<textarea id="s-system" rows="5"></textarea></label>
      </fieldset>

      <fieldset>
        <h3 class="legend">我</h3>
        <label>我的名字 <input id="s-user-name" type="text" maxlength="24" /></label>
      </fieldset>

      <fieldset>
        <h3 class="legend">Claude API <span class="hint">不填 key 就用示範回覆</span></h3>
        <label>API Key <input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off" /></label>
        <label>模型 <input id="s-model" type="text" /></label>
        <label>思考強度
          <select id="s-effort">
            <option value="low">low（聊天最快）</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </label>
        <p class="hint">Key 只存在這個瀏覽器的 localStorage，直接從瀏覽器呼叫 API，請只在自己的裝置上使用。</p>
      </fieldset>

      <fieldset>
        <h3 class="legend">小管家</h3>
        <div class="row">
          <span>天氣地點：<b id="s-place-name"></b></span>
          <button type="button" class="link" id="s-place-here">用目前位置</button>
        </div>
        <div class="place-search">
          <input id="s-place" type="text" placeholder="輸入城市，例如 台中" enterkeyhint="search" />
          <button type="button" class="file-btn" id="s-place-set">設定</button>
        </div>
        <div class="row">
          <span>提醒通知 <span class="hint" id="s-notify-state"></span></span>
          <button type="button" class="file-btn" id="s-notify">開啟通知</button>
        </div>
        <p class="hint">提醒要這個頁面開著（或留在背景）才會跳出來。</p>
      </fieldset>

      <fieldset>
        <h3 class="legend">背景</h3>
        <div class="row">
          <span>背景照片</span>
          <label class="file-btn">選擇圖片<input id="s-bg" type="file" accept="image/*" hidden /></label>
          <button type="button" class="link" id="s-bg-reset">還原</button>
        </div>
        <label>照片模糊 <input id="s-blur" type="range" min="0" max="30" step="1" /></label>
      </fieldset>

      <div class="actions">
        <button type="button" class="danger" id="s-clear">清空對話</button>
        <button value="close" class="primary">完成</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
